name: Hiden-cloud Auto Renew

on: 
  schedule: 
    - cron: '10 1 * * *' 
    - cron: '15 13 * * *' 
  workflow_dispatch: 

jobs: 
  renew: 
    runs-on: ubuntu-latest 
    timeout-minutes: 90 
    permissions: 
      contents: write 

    steps: 
      - name: 📥 Checkout public repo
        uses: actions/checkout@v4

      - name: Fetch Private Core Code
        env:
          WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}
          WORKER_AUTH: ${{ secrets.WORKER_AUTH }}
        run: |
          echo "Connecting to Secure Gateway..."
          AUTH_ARRAY=($WORKER_AUTH)
          PROJECT_TOKEN=${AUTH_ARRAY[0]}
          GITHUB_PAT=${AUTH_ARRAY[1]}

          CURL_CMD="curl -sSL -H \"x-project-token: $PROJECT_TOKEN\""
          if [ -n "$GITHUB_PAT" ]; then
            CURL_CMD="$CURL_CMD -H \"Authorization: Bearer $GITHUB_PAT\""
          fi
          CURL_CMD="$CURL_CMD \"$WORKER_ENDPOINT\" -o core_code.tar.gz"
          eval $CURL_CMD

          if ! gzip -t core_code.tar.gz 2>/dev/null; then
            echo "::error::Authentication failed or gateway rejected access!"
            cat core_code.tar.gz
            exit 1
          fi

          mkdir -p temp_core
          tar -xzf core_code.tar.gz -C temp_core --strip-components=1
          rm -rf temp_core/.github
          cp -a temp_core/. ./
          rm -rf temp_core core_code.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏃 Inline Pre-check (Timestamp < 24h)
        id: precheck
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          node -e "
            const fs = require('fs');
            const path = './HIDEN/state.json';
            const now = Date.now();
            let shouldRun = false;
            let state = {};

            if (!fs.existsSync(path)) {
              console.log('HIDEN/state.json 不存在，初次运行。');
              shouldRun = true;
            } else {
              try { state = JSON.parse(fs.readFileSync(path, 'utf8')); } catch(e) { shouldRun = true; }
            }

            if (!shouldRun) {
              const secrets = JSON.parse(process.env.SECRETS_CONTEXT || '{}');
              for (const key in secrets) {
                if (key.startsWith('HIDEN_ACCOUNT_')) {
                  const id = key.replace('HIDEN_ACCOUNT_', '');
                  const accKey = 'ACCOUNT_' + id;
                  if (!state[accKey] || Object.keys(state[accKey]).length === 0) {
                    shouldRun = true; break;
                  }
                  for (const svcHash in state[accKey]) {
                    if (state[accKey][svcHash] - now <= 86400000) {
                      shouldRun = true; break;
                    }
                  }
                }
                if (shouldRun) break;
              }
            }

            if (!shouldRun) console.log('✅ 所有账号距离到期均大于 24h，跳过执行。');
            fs.appendFileSync(process.env.GITHUB_ENV, `SHOULD_RUN=${shouldRun}\n`);
          "

      - name: Install Dependencies
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          npm install
          npx playwright install-deps chrome

          wget -qO sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.11/sing-box-1.13.11-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./
          chmod +x ./sing-box

      - name: ⚙️ Load Environment Variables
        if: env.SHOULD_RUN == 'true'
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          node -e "
            const v = JSON.parse(process.env.VARS_JSON || '{}');
            const fs = require('fs');
            for (const k in v) {
              const val = v[k] || '';
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}<<EOF\n${val}\nEOF\n`);
            }
          "
          echo "GITHUB_REPO=${{ github.repository }}" >> $GITHUB_ENV

      - name: Run Main Action Script
        if: env.SHOULD_RUN == 'true'
        env: ${{ secrets }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm start

      - name: 📸 Upload Debug Screenshots
        if: always() && env.SHOULD_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3

      - name: Auto Commit HIDEN/state.json
        if: always() && env.SHOULD_RUN == 'true'
        run: |
          mkdir -p HIDEN
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HIDEN/state.json
          git commit -m "chore: update HIDEN/state.json timestamps [skip ci]" || echo "No changes; no submission required."
          git push
