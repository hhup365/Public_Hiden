name: Auto Renew HidenCloud

on:
  workflow_dispatch:
  schedule:
    # 每日运行 2 次，先检查 state.json，只有存在需要续期的账号才安装环境并执行
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'

permissions:
  contents: write
  actions: write

jobs:
  renew-hiden:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # ── 预检：读取 state.json，判断是否有账号需要续期 ──
      # 无账号到期时直接结束，后续安装依赖/浏览器的步骤全部跳过
      - name: 🔎 检查是否有账号需要续期
        id: precheck
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          python3 - <<'PY'
          import json, os, time

          variables = json.loads(os.environ.get('VARS_JSON') or '{}')
          # 阈值可由仓库变量 DUE_WITHIN_HOURS 覆盖，默认 24 小时
          due_within_hours = float(variables.get('DUE_WITHIN_HOURS') or 24)

          accounts = {}
          for key, value in (json.loads(os.environ.get('SECRETS_JSON') or '{}')).items():
              if key.startswith('HIDEN_ACCOUNT_') and (value or '').strip():
                  parts = (value or '').split()
                  if len(parts) >= 2:
                      accounts[key.replace('HIDEN_ACCOUNT_', '')] = True

          state = {}
          if os.path.exists('state.json'):
              try:
                  state = json.load(open('state.json', encoding='utf-8'))
              except Exception:
                  state = {}

          now = int(time.time())
          pending = []
          for acc_id in sorted(accounts, key=int):
              acc_state = state.get(f'ACCOUNT_{acc_id}') or {}
              due_ts = acc_state.get('due_ts') or 0

              # 上次续期失败且仍在退避窗口内 → 本次不跑，同时避免无谓的环境安装
              retry_at = acc_state.get('retry_at') or 0
              if acc_state.get('last_result') == 'failed' and retry_at and now < retry_at:
                  print(f'⏳ 账号 {acc_id}: 上次续期失败，退避中（{int((retry_at - now) / 60)} 分钟后重试），跳过')
                  continue

              if not due_ts:
                  print(f'🆕 账号 {acc_id}: state.json 无到期记录，需要运行')
                  pending.append(acc_id)
                  continue
              remaining = due_ts - now
              if remaining <= due_within_hours * 3600:
                  print(f'⏰ 账号 {acc_id}: 剩余 {remaining/3600:.1f} 小时（到期日 {acc_state.get("due_date")}），需要运行')
                  pending.append(acc_id)
              else:
                  print(f'✅ 账号 {acc_id}: 剩余 {remaining/3600:.1f} 小时（到期日 {acc_state.get("due_date")}），跳过')

          should_run = 'true' if pending else 'false'
          if not pending:
              print('⏭️ 所有账号均未到期，跳过后续所有步骤。')
          else:
              print(f'🎯 本次需要续期的账号: {", ".join(pending)}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'SHOULD_RUN={should_run}\n')
              fh.write(f'RENEW_ACCOUNTS={",".join(pending)}\n')
              fh.write(f'DUE_WITHIN_HOURS={due_within_hours:g}\n')
          PY

      - name: ⚙ 设置 Python
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🛠️ 安装系统依赖和python依赖
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: 📦 安装 sing-box（供各账号独立代理使用）
        if: env.SHOULD_RUN == 'true'
        continue-on-error: true
        run: |
          VER=1.13.16
          wget -qO sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" \
            && tar -xzf sing-box.tar.gz \
            && mv "sing-box-${VER}-linux-amd64/sing-box" ./ \
            && chmod +x ./sing-box \
            && echo "SINGBOX_BIN=$PWD/sing-box" >> $GITHUB_ENV \
            && echo "✅ sing-box 就绪" \
            || echo "⚠️ sing-box 下载失败，本次将无法运行"

      # 可选兜底：未使用账号级 PROXY_URL_n 时可由 NODE_LINK 提供全局代理
      # 注意各账号仍必须配置自己的 PROXY_URL_n，此步骤仅作为额外保险
      - name: ⚙ 设置全局代理（可选 NODE_LINK）
        if: env.SHOULD_RUN == 'true'
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # 注意：写入 $GITHUB_ENV 只对「后续步骤」生效，对当前步骤无效。
      # 因此注入必须独立成一个 step，再执行 app.py，否则 app.py 读不到任何账号。
      - name: 🔑 注入环境变量
        if: env.SHOULD_RUN == 'true'
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          # 只挑选需要透传的变量名，值不会打印到日志
          python3 - <<'PY'
          import json, os, re

          secrets = json.loads(os.environ.get('SECRETS_JSON') or '{}')
          variables = json.loads(os.environ.get('VARS_JSON') or '{}')

          # 账号级变量按编号无限匹配，与 Test-hiden-cloud 的 HIDEN_ACCOUNT_N 保持一致
          account_pattern = re.compile(r'^(HIDEN_ACCOUNT|PROXY_URL|PROXY_LOCK)_\d+$')
          fixed_names = {
              # 兼容旧版单账号变量
              'EMAIL', 'PASSWORD', 'PROXY_URL', 'PROXY_LOCK', 'NODE_LINK',
              # 通知（新变量名）
              'TG_TOKEN', 'TG_CHAT', 'SMTP_CONFIG', 'EMAIL_CHAT',
              'WXPUSH_API', 'WXPUSH_TOKEN',
              # 通知（旧变量名，作为兜底）
              'TG_BOT_TOKEN', 'TG_CHAT_ID',
              # 运行参数
              'DUE_WITHIN_HOURS', 'RETRY_AFTER_HOURS',
          }

          names = sorted(n for n in (set(secrets) | set(variables))
                         if n in fixed_names or account_pattern.match(n))

          out = []
          for name in names:
              value = secrets.get(name)
              if value in (None, ''):
                  value = variables.get(name)
              if value in (None, ''):
                  continue
              # GITHUB_ENV 用多行分隔符写入，避免密码里的特殊字符被截断
              out.append(f'{name}<<__EOF__\n{value}\n__EOF__')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(out) + '\n')

          # 只打印变量名，不打印值
          print('已注入变量: ' + ', '.join(names))
          if not any(n.startswith('HIDEN_ACCOUNT_') for n in names):
              print('::error::未找到任何 HIDEN_ACCOUNT_n，请检查仓库 Secrets 是否配置了 HIDEN_ACCOUNT_1')
          PY

      - name: ✅ 校验变量已生效
        if: env.SHOULD_RUN == 'true'
        run: |
          # 确认注入的变量真的进入了本步骤的环境（值只判断长度，不打印内容）
          for i in 1 2 3 4 5; do
            name="HIDEN_ACCOUNT_$i"
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "✅ $name 已生效（长度 ${#value}）"
            fi
          done
          if [ -z "$(printenv HIDEN_ACCOUNT_1 || true)" ]; then
            echo "::error::HIDEN_ACCOUNT_1 未注入成功。请确认在 Settings → Secrets and variables → Actions 的 Secrets 中已添加 HIDEN_ACCOUNT_1（格式：邮箱 密码）"
            exit 1
          fi

      - name: 🚀 运行续期脚本
        if: env.SHOULD_RUN == 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u app.py

      - name: 📸 上传调试截图
        if: always() && env.SHOULD_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: art/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 💾 提交 state.json
        if: always() && env.SHOULD_RUN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "💾 Update state.json $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push || true
          fi

      # 更新时间到time.txt,避免6个月未更新导致工作流暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
